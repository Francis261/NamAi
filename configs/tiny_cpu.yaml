# Tiny config for CPU training (can make real progress)
# ~10M params, trains at ~3 tok/s on CPU
vocab_size: 50257
d_model: 128
d_state: 4
d_conv: 4
expand_factor: 2
num_layers: 6
attn_every_n: 3
num_attention_heads: 4
num_kv_heads: 2
d_head: 32
swiglu_hidden_mult: 2.75
sliding_window_size: 256
num_global_tokens: 8
max_seq_len: 256
rope_theta: 10000.0
rms_norm_eps: 1.0e-5
init_std: 0.02
use_checkpointing: false
